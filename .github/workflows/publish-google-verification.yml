name: Preserve Search Metadata
# Reapply search metadata after SEO pipeline update

on:
  push:
    branches:
      - main
    paths:
      - 'google053137c136af2773.html'
      - 'robots.txt'
      - 'tools/generate-sitemap.mjs'
      - '.github/workflows/publish-google-verification.yml'
  workflow_run:
    workflows:
      - 'Publish Theme Repository'
    types:
      - completed

concurrency:
  group: luxureat-search-metadata
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-search-metadata:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    env:
      THEME_REPO_DEPLOY_KEY: ${{ secrets.THEME_REPO_DEPLOY_KEY }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generate sitemap
        run: |
          node tools/generate-sitemap.mjs "$GITHUB_WORKSPACE/.seo/sitemap.xml"

      - name: Add GitHub deploy key
        run: |
          test -n "$THEME_REPO_DEPLOY_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$THEME_REPO_DEPLOY_KEY" > ~/.ssh/theme_repo_key
          chmod 600 ~/.ssh/theme_repo_key
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      - name: Checkout theme repository
        run: |
          git clone git@github.com:errpenk/luxureat-wordpress-theme.git "$GITHUB_WORKSPACE/.publish/theme"
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/theme_repo_key

      - name: Install search metadata endpoints
        run: |
          cp "$GITHUB_WORKSPACE/google053137c136af2773.html" "$GITHUB_WORKSPACE/.publish/theme/google053137c136af2773.html"
          cp "$GITHUB_WORKSPACE/robots.txt" "$GITHUB_WORKSPACE/.publish/theme/robots.txt"
          cp "$GITHUB_WORKSPACE/.seo/sitemap.xml" "$GITHUB_WORKSPACE/.publish/theme/sitemap.xml"

          if ! grep -q "function luxureat_google_site_verification" "$GITHUB_WORKSPACE/.publish/theme/functions.php"; then
            cat >> "$GITHUB_WORKSPACE/.publish/theme/functions.php" <<'PHP'

          function luxureat_google_site_verification() {
              $request_uri = isset($_SERVER['REQUEST_URI']) ? wp_unslash($_SERVER['REQUEST_URI']) : '';
              $request_path = parse_url($request_uri, PHP_URL_PATH);

              if ($request_path !== '/google053137c136af2773.html') {
                  return;
              }

              $verification_file = get_template_directory() . '/google053137c136af2773.html';
              if (!is_file($verification_file)) {
                  return;
              }

              status_header(200);
              nocache_headers();
              header('Content-Type: text/html; charset=UTF-8');
              readfile($verification_file);
              exit;
          }
          add_action('template_redirect', 'luxureat_google_site_verification', -100);
          PHP
          fi

          if ! grep -q "function luxureat_static_robots_txt" "$GITHUB_WORKSPACE/.publish/theme/functions.php"; then
            cat >> "$GITHUB_WORKSPACE/.publish/theme/functions.php" <<'PHP'

          function luxureat_static_robots_txt($output, $public) {
              $robots_file = get_template_directory() . '/robots.txt';
              if (!is_file($robots_file) || !is_readable($robots_file)) {
                  return $output;
              }

              $contents = file_get_contents($robots_file);
              return is_string($contents) ? $contents : $output;
          }
          add_filter('robots_txt', 'luxureat_static_robots_txt', 999, 2);

          function luxureat_static_sitemap_endpoint() {
              $request_uri = isset($_SERVER['REQUEST_URI']) ? wp_unslash($_SERVER['REQUEST_URI']) : '';
              $request_path = parse_url($request_uri, PHP_URL_PATH);

              if ($request_path !== '/sitemap.xml') {
                  return;
              }

              $sitemap_file = get_template_directory() . '/sitemap.xml';
              if (!is_file($sitemap_file) || !is_readable($sitemap_file)) {
                  return;
              }

              status_header(200);
              nocache_headers();
              header('Content-Type: application/xml; charset=UTF-8');
              readfile($sitemap_file);
              exit;
          }
          add_action('template_redirect', 'luxureat_static_sitemap_endpoint', -100);
          PHP
          fi

      - name: Commit and push search metadata
        run: |
          cd "$GITHUB_WORKSPACE/.publish/theme"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "Search metadata is already up to date."
          else
            git add functions.php google053137c136af2773.html robots.txt sitemap.xml
            git commit -m "Preserve search verification and SEO files"
            git push origin main
          fi
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/theme_repo_key

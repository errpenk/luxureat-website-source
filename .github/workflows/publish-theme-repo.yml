name: Publish Theme Repository

on:
  push:
    branches:
      - main
    paths:
      - 'zh/**'
      - 'en/**'
      - 'assets/**'
      - 'integration.css'
      - 'site.config.mjs'
      - 'scripts/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/publish-theme-repo.yml'
  workflow_dispatch:

concurrency:
  group: luxureat-theme-repo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      THEME_REPO_DEPLOY_KEY: ${{ secrets.THEME_REPO_DEPLOY_KEY }}
      BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install image optimizer
        run: npm ci

      - name: Optimize uploaded images
        run: npm run images:optimize

      - name: Check generated page structure
        run: npm run site:check

      - name: Build WordPress theme
        run: |
          node scripts/build-luxureat-theme.mjs "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.deploy"

      - name: Add Baidu verification endpoint
        run: |
          cat >> "$GITHUB_WORKSPACE/.deploy/luxureat-static/functions.php" <<'PHP'

          function luxureat_baidu_site_verification() {
              $request_uri = isset($_SERVER['REQUEST_URI']) ? wp_unslash($_SERVER['REQUEST_URI']) : '';
              $request_path = parse_url($request_uri, PHP_URL_PATH);

              if ($request_path !== '/baidu_verify_codeva-unoYAk5W8p.html') {
                  return;
              }

              status_header(200);
              nocache_headers();
              header('Content-Type: text/html; charset=UTF-8');
              echo '6c9c028426f2f70621969ba37ffb0ae3';
              exit;
          }
          add_action('template_redirect', 'luxureat_baidu_site_verification', -100);
          PHP

      - name: Verify built theme
        run: |
          node tools/verify-theme.mjs "$GITHUB_WORKSPACE/.deploy"

      - name: Lint generated PHP
        run: |
          find "$GITHUB_WORKSPACE/.deploy/luxureat-static" -name '*.php' -print0 | xargs -0 -n 1 php -l

      - name: Add GitHub deploy key
        run: |
          test -n "$THEME_REPO_DEPLOY_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$THEME_REPO_DEPLOY_KEY" > ~/.ssh/theme_repo_key
          chmod 600 ~/.ssh/theme_repo_key
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      - name: Checkout theme repository
        run: |
          git clone git@github.com:errpenk/luxureat-wordpress-theme.git "$GITHUB_WORKSPACE/.publish/theme"
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/theme_repo_key

      - name: Mirror generated theme files
        run: |
          rsync -a --delete \
            --exclude='.git' \
            "$GITHUB_WORKSPACE/.deploy/luxureat-static/" \
            "$GITHUB_WORKSPACE/.publish/theme/"

      - name: Commit and push theme repository
        run: |
          cd "$GITHUB_WORKSPACE/.publish/theme"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "No theme repository changes to publish."
          else
            git add -A
            git commit -m "Publish theme from ${GITHUB_SHA}"
            git push origin main
          fi
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/theme_repo_key

      - name: Build Baidu URL list from site config
        env:
          BAIDU_URLS_FILE: ${{ runner.temp }}/baidu-urls.txt
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { pages } from './site.config.mjs';

          const site = 'https://luxureat.cn';
          const excludedSlugs = new Set(['bag', 'cart', 'checkout', 'account', 'login', 'register']);

          const urls = pages
            .filter((page) => page && page.indexable !== false && !excludedSlugs.has(page.slug))
            .map((page) => {
              const route = String(page.route || '').replace(/^\/+|\/+$/g, '');
              if (!route || route === 'zh') {
                return `${site}/`;
              }
              if (route.startsWith('zh/')) {
                return `${site}/${route.slice(3)}/`;
              }
              return `${site}/${route}/`;
            });

          const uniqueUrls = [...new Set(urls)];
          fs.writeFileSync(process.env.BAIDU_URLS_FILE, `${uniqueUrls.join('\n')}\n`, 'utf8');
          console.log(`Prepared ${uniqueUrls.length} indexable URLs for Baidu:`);
          console.log(uniqueUrls.join('\n'));
          NODE

      - name: Push public URLs to Baidu
        env:
          BAIDU_URLS_FILE: ${{ runner.temp }}/baidu-urls.txt
        run: |
          if [ -z "$BAIDU_PUSH_TOKEN" ]; then
            echo "::warning::BAIDU_PUSH_TOKEN is not configured; skipping Baidu URL submission."
            exit 0
          fi

          if [ ! -s "$BAIDU_URLS_FILE" ]; then
            echo "::warning::No indexable URLs were generated; skipping Baidu URL submission."
            exit 0
          fi

          if ! response="$(curl --fail-with-body -sS \
            -H 'Content-Type: text/plain' \
            --data-binary @"$BAIDU_URLS_FILE" \
            "http://data.zz.baidu.com/urls?site=luxureat.cn&token=${BAIDU_PUSH_TOKEN}")"; then
            echo "Baidu response: $response"
            echo "::warning::Baidu URL submission request failed."
            exit 0
          fi

          echo "Baidu response: $response"
          if printf '%s' "$response" | grep -q '"error"'; then
            echo "::warning::Baidu returned an error response: $response"
          fi

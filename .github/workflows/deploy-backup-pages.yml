name: Deploy Backup Preview

on:
  push:
    branches:
      - backup
  workflow_dispatch:

concurrency:
  group: backup-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout backup branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Optimize uploaded images
        run: |
          npm ci
          npm run images:optimize

      - name: Check generated page structure
        run: npm run site:check

      - name: Prepare static preview
        run: |
          mkdir -p .pages
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.deploy' \
            --exclude='docs' \
            --exclude='qa' \
            --exclude='scripts' \
            --exclude='site.config.mjs' \
            --exclude='tools' \
            --exclude='wordpress-plugins' \
            --exclude='node_modules' \
            ./ .pages/
          install -D node_modules/leaflet/dist/leaflet.css .pages/assets/vendor/leaflet/leaflet.css
          install -D node_modules/leaflet/dist/leaflet.js .pages/assets/vendor/leaflet/leaflet.js
          cp -R node_modules/leaflet/dist/images .pages/assets/vendor/leaflet/images

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

name: Preserve Search URL Guard

on:
  push:
    branches:
      - main
    paths:
      - 'wordpress-snippets/search-url-guard.php.fragment'
      - '.github/workflows/preserve-search-url-guard.yml'
  workflow_run:
    workflows:
      - 'Publish Theme Repository'
    types:
      - completed

concurrency:
  group: luxureat-search-url-guard
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-guard:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    env:
      THEME_REPO_DEPLOY_KEY: ${{ secrets.THEME_REPO_DEPLOY_KEY }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Add GitHub deploy key
        run: |
          test -n "$THEME_REPO_DEPLOY_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$THEME_REPO_DEPLOY_KEY" > ~/.ssh/theme_repo_key
          chmod 600 ~/.ssh/theme_repo_key
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      - name: Checkout theme repository
        run: |
          git clone git@github.com:errpenk/luxureat-wordpress-theme.git "$GITHUB_WORKSPACE/.publish/theme"
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/theme_repo_key

      - name: Install Search URL guard
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()
          functions = root / '.publish/theme/functions.php'
          fragment = (root / 'wordpress-snippets/search-url-guard.php.fragment').read_text(encoding='utf-8').strip()
          text = functions.read_text(encoding='utf-8')
          pattern = re.compile(
              r'\n?// LUXUREAT_SEARCH_URL_GUARD_BEGIN.*?// LUXUREAT_SEARCH_URL_GUARD_END\n?',
              re.S,
          )
          text = pattern.sub('\n', text).rstrip() + '\n\n' + fragment + '\n'
          functions.write_text(text, encoding='utf-8')
          PY

      - name: Lint updated PHP
        run: php -l "$GITHUB_WORKSPACE/.publish/theme/functions.php"

      - name: Commit and push URL guard
        run: |
          cd "$GITHUB_WORKSPACE/.publish/theme"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "Search URL guard is already current."
          else
            git add functions.php
            git commit -m "Preserve Search Console spam URL guard"
            git push origin main
          fi
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/theme_repo_key

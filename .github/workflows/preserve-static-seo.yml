name: Preserve Static SEO
# Static SEO metadata pipeline v2

on:
  push:
    branches:
      - main
    paths:
      - 'site.config.mjs'
      - 'tools/generate-static-seo.mjs'
      - '.github/workflows/preserve-static-seo.yml'
  workflow_run:
    workflows:
      - 'Publish Theme Repository'
    types:
      - completed

concurrency:
  group: luxureat-search-metadata
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-static-seo:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    env:
      THEME_REPO_DEPLOY_KEY: ${{ secrets.THEME_REPO_DEPLOY_KEY }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generate static SEO module
        run: node tools/generate-static-seo.mjs "$GITHUB_WORKSPACE/.seo/static-seo.php"

      - name: Add GitHub deploy key
        run: |
          test -n "$THEME_REPO_DEPLOY_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$THEME_REPO_DEPLOY_KEY" > ~/.ssh/theme_repo_key
          chmod 600 ~/.ssh/theme_repo_key
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      - name: Checkout theme repository
        run: |
          git clone git@github.com:errpenk/luxureat-wordpress-theme.git "$GITHUB_WORKSPACE/.publish/theme"
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/theme_repo_key

      - name: Install static SEO
        run: |
          cp "$GITHUB_WORKSPACE/.seo/static-seo.php" "$GITHUB_WORKSPACE/.publish/theme/static-seo.php"
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()
          functions = root / '.publish/theme/functions.php'
          index = root / '.publish/theme/index.php'

          # Clean up the earlier inline implementation if it was ever installed.
          functions_text = functions.read_text(encoding='utf-8')
          functions_text = re.sub(
              r'\n?// LUXUREAT_STATIC_SEO_BEGIN.*?// LUXUREAT_STATIC_SEO_END\n?',
              '\n',
              functions_text,
              flags=re.S,
          )
          functions.write_text(functions_text.rstrip() + '\n', encoding='utf-8')

          index_text = index.read_text(encoding='utf-8')
          require_line = "require_once get_template_directory() . '/static-seo.php';"
          if require_line not in index_text:
              anchor = "if (!defined('ABSPATH')) {\n    exit;\n}\n"
              if anchor not in index_text:
                  raise SystemExit('Could not find index.php bootstrap anchor')
              index_text = index_text.replace(anchor, anchor + "\n" + require_line + "\n", 1)
          index.write_text(index_text, encoding='utf-8')
          PY

      - name: Lint updated PHP
        run: |
          php -l "$GITHUB_WORKSPACE/.publish/theme/static-seo.php"
          php -l "$GITHUB_WORKSPACE/.publish/theme/index.php"
          php -l "$GITHUB_WORKSPACE/.publish/theme/functions.php"

      - name: Commit and push static SEO
        run: |
          cd "$GITHUB_WORKSPACE/.publish/theme"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "Static SEO is already current."
          else
            git add static-seo.php index.php functions.php
            git commit -m "Preserve static route SEO metadata"
            git push origin main
          fi
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/theme_repo_key

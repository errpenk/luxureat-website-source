name: Check Images

on:
  pull_request:
    paths:
      - 'assets/media/**'
      - 'tools/optimize-images.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/check-images.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Check image size and compression
        run: |
          npm ci
          npm run images:check
